<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TFT オーグメント翻訳ノート</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20x='2.2'%20y='2.2'%20width='27.6'%20height='27.6'%20rx='7'%20fill='%23ffde6a'%20stroke='%23333'%20stroke-width='2.4'/%3E%3Cpath%20d='M16%207.3%20L23%2011.3%20V19.3%20L16%2023.3%20L9%2019.3%20V11.3%20Z'%20fill='%23fff'%20stroke='%23333'%20stroke-width='2'%20stroke-linejoin='round'/%3E%3Ccircle%20cx='16'%20cy='15.3'%20r='2.6'%20fill='%23ffde6a'%20stroke='%23333'%20stroke-width='1.6'/%3E%3C/svg%3E">
    <style>
        :root {
            --bg:#f7f9fc; --panel:#ffffff; --ink:#333; --sub:#64748b;
            --accent:#ffde6a; --line:#e2e8f0;
            --soku:#dc2626; --soku-bg:#fee2e2;
            --tori:#d97706; --tori-bg:#fef9c3;
            --da:#2563eb;   --da-bg:#dbeafe;
            --batsu:#475569; --batsu-bg:#e2e8f0;
        }
        * { box-sizing:border-box; }
        body {
            font-family:'Helvetica Neue',Arial,'Hiragino Kaku Gothic ProN','Hiragino Sans',Meiryo,sans-serif;
            background:var(--bg); color:var(--ink); margin:0; padding:10px;
        }
        h1 {
            color:#4a5568; font-size:19px; margin:6px 0 12px; text-align:center;
            text-shadow:1px 1px 0 #fff, 2px 2px 0 var(--accent);
        }
        .wrap { max-width:1280px; margin:0 auto; }

        /* スティッキー操作バー（タブ＋フィルタ） */
        .bar {
            position:sticky; top:0; z-index:30; background:var(--panel);
            border:2px solid #333; border-radius:14px; box-shadow:0 4px 0 #333;
            padding:10px; margin-bottom:14px; display:flex; flex-direction:column; gap:9px;
        }
        .tabs { display:flex; gap:6px; }
        .tab {
            flex:1 1 0; padding:9px 6px; font-size:14px; font-weight:bold; text-align:center;
            border:2px solid #333; border-radius:10px; background:#fff; box-shadow:2px 2px 0 #333;
            cursor:pointer; white-space:nowrap; transition:transform .1s, box-shadow .1s;
        }
        .tab:active { transform:translate(1px,1px); box-shadow:0 0 0 #333; }
        .tab[data-tier="silver"].active { background:#cbd5e1; }
        .tab[data-tier="gold"].active   { background:#fef08a; }
        .tab[data-tier="prism"].active  { background:#fbcfe8; }

        .filters { display:flex; flex-wrap:wrap; gap:7px; align-items:center; }
        .search {
            flex:1 1 100%; min-width:0; padding:8px 11px; font-size:14px; font-family:inherit;
            border:2px solid #333; border-radius:10px;
        }
        .search:focus { outline:none; }
        .fsel {
            flex:1 1 0; min-width:96px; padding:7px 8px; font-size:13px; font-weight:bold; font-family:inherit;
            border:2px solid #333; border-radius:10px; background:#fff; cursor:pointer;
        }
        .count { flex:0 0 auto; font-size:12px; font-weight:bold; color:var(--sub); margin-left:auto; padding:4px 2px; }
        @media (min-width:640px){
            .search { flex:1 1 200px; }
        }

        /* カードグリッド：モバイル1列 → タブレット2列 → PC3列 */
        .cards { display:grid; grid-template-columns:1fr; gap:12px; }
        @media (min-width:680px){  .cards { grid-template-columns:repeat(2,1fr); } }
        @media (min-width:1040px){ .cards { grid-template-columns:repeat(3,1fr); } }
        .pane { display:none; }
        .pane.active { display:block; }

        /* 1オーグメント＝1カード */
        .card {
            display:flex; flex-direction:column; gap:9px; background:var(--panel);
            border:2px solid #333; border-radius:14px; box-shadow:2px 2px 0 #333; padding:12px;
        }
        .card.is-soku  { border-color:var(--soku);  box-shadow:2px 2px 0 var(--soku); }
        .card.is-tori  { border-color:var(--tori);  box-shadow:2px 2px 0 var(--tori); }
        .card.is-da    { border-color:var(--da);    box-shadow:2px 2px 0 var(--da); }
        .card.is-batsu { opacity:.62; }

        .c-head { display:flex; align-items:center; gap:10px; }
        .c-icon {
            width:44px; height:44px; flex:0 0 auto; border-radius:10px; border:2px solid #333;
            background:#222; object-fit:contain;
        }
        .c-title { flex:1 1 auto; min-width:0; font-weight:bold; font-size:15px; line-height:1.3; }
        /* 優先度バッジ（表示専用） */
        .prio {
            display:block; min-width:40px; padding:7px 11px; font-size:15px; font-weight:bold; text-align:center;
            border:2px solid #333; border-radius:10px; background:#fff; line-height:1;
        }
        .prio.p-soku  { color:var(--soku);  background:var(--soku-bg); }
        .prio.p-tori  { color:var(--tori);  background:var(--tori-bg); }
        .prio.p-da    { color:var(--da);    background:var(--da-bg); }
        .prio.p-batsu { color:var(--batsu); background:var(--batsu-bg); }
        .prio.none    { color:#cbd5e1; background:#f8fafc; border-color:#cbd5e1; }

        .genres { display:flex; flex-wrap:wrap; gap:5px; }
        .badge {
            display:inline-block; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:bold;
            border:1px solid #333;
        }
        .genre-money   { background:#bbf7d0; }
        .genre-battle  { background:#fecaca; }
        .genre-item    { background:#bfdbfe; }
        .genre-special { background:#e9d5ff; }

        .effect { font-size:13px; line-height:1.55; color:#1f2937; }

        .c-foot { border-top:1.5px dashed var(--line); padding-top:9px; display:flex; flex-direction:column; gap:8px; }
        .field-row { display:flex; align-items:center; gap:8px; }
        .field-lbl { flex:0 0 auto; font-size:11px; font-weight:bold; color:var(--sub); width:70px; }
        .rchips { display:flex; gap:5px; flex-wrap:wrap; }
        .rchip {
            font-size:12px; font-weight:bold; border:1.5px solid #e2e8f0; border-radius:13px;
            padding:3px 11px; background:#f8fafc; color:#cbd5e1; user-select:none;
        }
        .rchip.on { background:var(--accent); color:#333; border-color:#333; }
        .memo {
            width:100%; border:1.5px solid #cbd5e1; border-radius:8px; padding:7px; font-family:inherit;
            font-size:13px; resize:vertical; background:#fff;
        }
        .memo:focus { outline:none; border-color:#333; background:#fffdf2; }

        .empty { grid-column:1/-1; text-align:center; color:#94a3b8; font-weight:bold; padding:30px; }

        /* 操作ボタン（保存・書き出し・読み込み） */
        .actions { display:flex; gap:7px; flex-wrap:wrap; }
        .abtn {
            flex:1 1 0; min-width:90px; padding:8px 10px; font-size:13px; font-weight:bold; font-family:inherit;
            border:2px solid #333; border-radius:10px; background:#fff; box-shadow:2px 2px 0 #333;
            cursor:pointer; white-space:nowrap; transition:transform .1s, box-shadow .1s;
        }
        .abtn:active { transform:translate(2px,2px); box-shadow:0 0 0 #333; }
        .abtn.save { background:var(--accent); }

        /* 保存トースト */
        .toast {
            position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px);
            background:#333; color:#fff; font-weight:bold; font-size:14px; padding:11px 22px;
            border-radius:12px; box-shadow:0 4px 0 rgba(0,0,0,.25); z-index:100;
            opacity:0; pointer-events:none; transition:opacity .25s, transform .25s;
        }
        .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
        .toast.err { background:var(--soku); }
    </style>
</head>
<body>
<div class="wrap">
    <h1>TFT オーグメント翻訳ノート 📝</h1>

    <div class="bar">
        <div class="tabs">
            <button class="tab active" data-tier="silver">銀 Silver</button>
            <button class="tab" data-tier="gold">金 Gold</button>
            <button class="tab" data-tier="prism">虹 Prism</button>
        </div>
        <div class="filters">
            <input type="text" class="search" id="search" placeholder="🔍 名前・効果・メモで検索…">
            <select class="fsel" id="filter-prio">
                <option value="">優先度：全</option>
                <option value="soku">即</option>
                <option value="tori">取</option>
                <option value="da">妥</option>
                <option value="batsu">×</option>
            </select>
            <select class="fsel" id="filter-genre">
                <option value="">ジャンル：全</option>
                <option value="金策">金策</option>
                <option value="戦闘">戦闘</option>
                <option value="アイテム">アイテム</option>
                <option value="特殊">特殊</option>
            </select>
            <select class="fsel" id="filter-round">
                <option value="">ラウンド：全</option>
                <option value="2-1">2-1</option>
                <option value="3-2">3-2</option>
                <option value="4-2">4-2</option>
            </select>
            <span class="count" id="count"></span>
        </div>
        <div class="actions">
            <button class="abtn save" id="btn-save">💾 保存</button>
            <button class="abtn" id="btn-export">📤 書き出し</button>
            <button class="abtn" id="btn-import">📥 読み込み</button>
            <input type="file" id="import-file" accept="application/json,.json" hidden>
        </div>
    </div>

    <div id="pane-silver" class="pane active"><div class="cards" id="cards-silver"></div></div>
    <div id="pane-gold"   class="pane"><div class="cards" id="cards-gold"></div></div>
    <div id="pane-prism"  class="pane"><div class="cards" id="cards-prism"></div></div>
</div>

<div class="toast" id="toast"></div>

        const KEY_MIGRATED = "noteKeyByName_v1";
        const LEGACY_KEY_RE = /^(prio|memo)-(silver|gold|prism)-\d+$/;

        function migrateNoteKeys(){
            try {
                // ① 番号キー → 名前キー（初回のみ。旧キーは bak- を付けて退避）
                if(!localStorage.getItem(KEY_MIGRATED)){
                    Object.keys(LEGACY_ORDER).forEach(tier=>{
                        LEGACY_ORDER[tier].forEach((name, i)=>{
                            ["prio","memo"].forEach(kind=>{
                                const oldK = kind + "-" + tier + "-" + i;
                                const v = localStorage.getItem(oldK);
                                if(v === null) return;
                                if(v !== "") localStorage.setItem(noteKey(kind, {name}), v);
                                localStorage.setItem("bak-" + oldK, v);
                                localStorage.removeItem(oldK);
                            });
                        });
                    });
                    localStorage.setItem(KEY_MIGRATED, "1");
                }
                // ② 改名の引き継ぎ（新名側が未設定のときだけ）
                Object.keys(RENAMED).forEach(oldName=>{
                    ["prio","memo"].forEach(kind=>{
                        const oldK = noteKey(kind, {name: oldName});
                        const v = localStorage.getItem(oldK);
                        if(v === null) return;
                        const newK = noteKey(kind, {name: RENAMED[oldName]});
                        if(!localStorage.getItem(newK)) localStorage.setItem(newK, v);
                        localStorage.removeItem(oldK);
                    });
                });
            } catch(e) { console.warn("メモの移行に失敗", e); }
        }

        function init(){
            migrateNoteKeys();

            // 旧バージョンで保存された出現ラウンドのキャッシュを一度だけ掃除する
            // （出現ラウンドは常にデータ側のdefaultRoundを表示する仕様に変更したため）
            for(let i = localStorage.length - 1; i >= 0; i--){
                const k = localStorage.key(i);
                if(k && k.startsWith("round-")) localStorage.removeItem(k);
            }

            document.querySelectorAll(".tab").forEach(tab=>{
                tab.addEventListener("click", ()=>{
                    document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
                    document.querySelectorAll(".pane").forEach(p=>p.classList.remove("active"));
                    tab.classList.add("active");
                    activeTier = tab.dataset.tier;
                    document.getElementById("pane-"+activeTier).classList.add("active");
                    applyFilters();
                });
            });

            TIERS.forEach(tier=>{
                const grid = document.getElementById("cards-"+tier);
                (augmentsData[tier]||[]).forEach((aug, index)=>{
                    const rowId = tier + "-" + index;
                    grid.appendChild(makeCard(aug, rowId, tier));
                });
            });

            document.getElementById("search").addEventListener("input", applyFilters);
            document.getElementById("filter-prio").addEventListener("change", applyFilters);
            document.getElementById("filter-genre").addEventListener("change", applyFilters);
            document.getElementById("filter-round").addEventListener("change", applyFilters);

            document.getElementById("btn-save").addEventListener("click", saveAll);
            document.getElementById("btn-export").addEventListener("click", exportData);

        function makeCard(aug, rowId, tier){
            const gList = genreArr(aug.genre);

            // 保存値（編集できるのは備考[メモ]のみ。優先度・ラウンドは表示専用）
            const pk = noteKey("prio", aug), mk = noteKey("memo", aug);
            const savedPrio = localStorage.getItem(pk) || "";
            const savedMemo = localStorage.getItem(mk) || "";
            // 出現ラウンドはデータ（defaultRound）由来の表示専用項目。
            // localStorageにはキャッシュせず、常にエディタで設定した最新の値を表示する。
            const defaultRound = aug.defaultRound || "";
            const roundTokens = defaultRound.split(",").map(s=>s.trim()).filter(Boolean);

            const card = document.createElement("div");
            card.className = "card" + (PRIO_CARD[savedPrio] ? " " + PRIO_CARD[savedPrio] : "");
            card.id = "card-" + rowId;

            const iconUrl = aug.icon && aug.icon.startsWith("http") ? aug.icon : (imageBaseUrl + (aug.icon||""));
            const badges = gList.map(g=>
                '<span class="badge '+(GENRE_CLASS[g]||"")+'">'+esc(g)+'</span>').join("");

            const prioCls = PRIO_CLASS[savedPrio] || "none";
            const prioTxt = PRIO_LABEL[savedPrio] || "-";

            const rchips = ROUNDS.map(r=>
                '<span class="rchip'+(roundTokens.includes(r) ? " on" : "")+'">'+r+'</span>').join("");

            // 優先度選択のオプション（透明なselectタグ用）
            const prioOptions = `
                <option value="" ${savedPrio === "" ? "selected" : ""}>- (未設定)</option>
                <option value="soku" ${savedPrio === "soku" ? "selected" : ""}>即 (即ピック)</option>
                <option value="tori" ${savedPrio === "tori" ? "selected" : ""}>取 (取る)</option>
                <option value="da" ${savedPrio === "da" ? "selected" : ""}>妥 (妥協)</option>
                <option value="batsu" ${savedPrio === "batsu" ? "selected" : ""}>× (取らない)</option>
            `;

            card.innerHTML =
              '<div class="c-head">'+
                '<img class="c-icon" src="'+iconUrl+'" alt="" onerror="this.style.opacity=0.3">'+
                '<div class="c-title">'+esc(aug.name)+'</div>'+
                // ▼ ここを修正：バッジの上に透明なselectを被せる ▼
                '<div style="position:relative; flex:0 0 auto;">'+
                    '<span class="prio '+prioCls+'" id="prio-badge-'+rowId+'">'+prioTxt+'</span>'+
                    '<select id="prio-sel-'+rowId+'" style="position:absolute; top:0; left:0; width:100%; height:100%; opacity:0; cursor:pointer; appearance:none;">'+
                        prioOptions +
                    '</select>'+
                '</div>'+
                // ▲ 修正ここまで ▲
              '</div>'+
              (badges ? '<div class="genres">'+badges+'</div>' : '')+
              '<div class="effect">'+esc(aug.effect)+'</div>'+
              '<div class="c-foot">'+
                '<div class="field-row">'+
                  '<span class="field-lbl">出現ラウンド</span>'+
                  '<div class="rchips">'+rchips+'</div>'+
                '</div>'+
                '<div class="field-row" style="align-items:flex-start">'+
                  '<span class="field-lbl" style="margin-top:6px">メモ</span>'+
                  '<textarea class="memo" id="memo-'+rowId+'" rows="2" placeholder="メモを入力…">'+esc(savedMemo)+'</textarea>'+
                '</div>'+
              '</div>';

            const memo = card.querySelector("#memo-"+CSS.escape(rowId));
            memo.addEventListener("input", ()=> localStorage.setItem(mk, memo.value));

            // ▼ 追加：selectの変更イベントを拾って見た目とデータを更新 ▼
            const prioSel = card.querySelector("#prio-sel-"+CSS.escape(rowId));
            const prioBadge = card.querySelector("#prio-badge-"+CSS.escape(rowId));
            
            prioSel.addEventListener("change", (e) => {
                const nextPrio = e.target.value;

                // データの保存
                localStorage.setItem(pk, nextPrio);

                // バッジのテキストと色の更新
                prioBadge.className = "prio " + (PRIO_CLASS[nextPrio] || "none");
                prioBadge.textContent = PRIO_LABEL[nextPrio] || "-";

                // カード全体の枠色の更新
                card.classList.remove("is-soku", "is-tori", "is-da", "is-batsu");
                if (PRIO_CARD[nextPrio]) {
                    card.classList.add(PRIO_CARD[nextPrio]);
                }
            });
            // ▲ 追加ここまで ▲

            cards[rowId] = {
                el: card,
                name: (aug.name||"").toLowerCase(),
                effect: (aug.effect||"").toLowerCase(),
                genre: gList.join(","),
                pk, mk
            };
            return card;
        }

        function applyFilters(){
            const q       = document.getElementById("search").value.trim().toLowerCase();
            const prioF   = document.getElementById("filter-prio").value;
            const genreF  = document.getElementById("filter-genre").value;
            const roundF  = document.getElementById("filter-round").value;

            const grid = document.getElementById("cards-"+activeTier);
            const list = (augmentsData[activeTier]||[]);
            let shown = 0;

            list.forEach((aug, index)=>{
                const rowId = activeTier + "-" + index;
                const c = cards[rowId]; if(!c) return;

                const prio  = localStorage.getItem(c.pk) || "";
                const memo  = (localStorage.getItem(c.mk) || "").toLowerCase();
                const round = (aug.defaultRound || "").toLowerCase();

                const mText  = !q || c.name.includes(q) || c.effect.includes(q) || memo.includes(q);
                const mPrio  = !prioF || prio === prioF;
                const mGenre = !genreF || c.genre.split(",").includes(genreF);
                const mRound = !roundF || round.includes(roundF.toLowerCase());

                const vis = mText && mPrio && mGenre && mRound;
                c.el.style.display = vis ? "" : "none";
                if(vis) shown++;
            });

            let emptyEl = grid.querySelector(".empty");
            if(shown === 0){
                if(!emptyEl){
                    emptyEl = document.createElement("div");
                    emptyEl.className = "empty"; emptyEl.textContent = "該当なし";
                    grid.appendChild(emptyEl);
                }
            } else if(emptyEl){ emptyEl.remove(); }

            document.getElementById("count").textContent = "表示 " + shown + " / 全 " + list.length + " 件";
        }

        // ===== 保存・バックアップ機能 =====
        function showToast(msg, isErr){
            const t = document.getElementById("toast");
            t.textContent = msg;
            t.className = "toast show" + (isErr ? " err" : "");
            clearTimeout(showToast._t);
            showToast._t = setTimeout(()=>{ t.className = "toast"; }, 1900);
        }

        // 手動保存：DOM上の最新メモ・優先度をlocalStorageへ確定保存（自動保存の取りこぼし対策）
        function saveAll(){
            let n = 0;
            Object.keys(cards).forEach(rowId=>{
                const memoEl = document.getElementById("memo-"+rowId);
                if(memoEl){ localStorage.setItem(cards[rowId].mk, memoEl.value); }
                const selEl = document.getElementById("prio-sel-"+rowId);
                if(selEl){ localStorage.setItem(cards[rowId].pk, selEl.value); }
                n++;
            });
            showToast("保存しました ✓（" + n + "件）");
        }

        // 書き出し：全データをJSONファイルとしてダウンロード
        function exportData(){
            const data = {};
            for(let i=0; i<localStorage.length; i++){
                const k = localStorage.key(i);
                if(/^(prio|memo)-/.test(k)){ data[k] = localStorage.getItem(k); }
            }
            const payload = { app:"tft-augment-note", savedAt:new Date().toISOString(), data };
            const blob = new Blob([JSON.stringify(payload, null, 2)], {type:"application/json"});
            const url = URL.createObjectURL(blob);
            const d = new Date(), pad = x=>String(x).padStart(2,"0");
            const a = document.createElement("a");
            a.href = url;
            a.download = "augment-note-" + d.getFullYear() + pad(d.getMonth()+1) + pad(d.getDate())
                       + "-" + pad(d.getHours()) + pad(d.getMinutes()) + ".json";
            document.body.appendChild(a); a.click(); a.remove();
            URL.revokeObjectURL(url);
            showToast("書き出しました ✓");
        }

        // 読み込み：JSONバックアップを取り込んでlocalStorageへ反映
        function importData(e){
            const file = e.target.files && e.target.files[0];
            e.target.value = ""; // 同じファイルを連続で選べるようにリセット
            if(!file) return;
            const reader = new FileReader();
            reader.onload = ()=>{
                try {
                    const parsed = JSON.parse(reader.result);
                    const data = parsed && parsed.data ? parsed.data : parsed;
                    if(!data || typeof data !== "object") throw new Error("形式が不正です");
                    const keys = Object.keys(data).filter(k=> /^(prio|memo)-/.test(k));
                    if(keys.length === 0) throw new Error("対象データがありません");
                    if(!confirm("バックアップを読み込み、現在のメモ・優先度を上書きします。よろしいですか？")) return;
                    keys.forEach(k=> localStorage.setItem(k, data[k]));
                    // 旧方式（番号キー）のバックアップなら、再読込時に名前キーへ移し替える
                    if(keys.some(k=> LEGACY_KEY_RE.test(k))) localStorage.removeItem(KEY_MIGRATED);
                    showToast("読み込みました ✓（" + keys.length + "件）再描画中…");
                    setTimeout(()=> location.reload(), 750);
                } catch(err){
                    showToast("読み込み失敗: " + err.message, true);
                }
            };
            reader.onerror = ()=> showToast("ファイル読み込みエラー", true);
            reader.readAsText(file);
        }

        window.onload = init;

</script>
</body>
